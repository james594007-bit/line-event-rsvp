<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>活動報名</title>
<style>
  body { font-family: -apple-system, "PingFang TC", sans-serif; margin: 0; padding: 16px; background: #f7f7f7; color: #222; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .info { background: white; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.7; }
  .info div { display: flex; }
  .info .label { width: 72px; color: #888; flex-shrink: 0; }
  .notes { white-space: pre-wrap; font-size: 12px; color: #777; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
  .count { font-size: 32px; font-weight: 700; margin: 8px 0 4px; }
  .count small { font-size: 14px; font-weight: 400; color: #666; }
  .subcount { font-size: 13px; color: #666; margin-bottom: 12px; }
  .option-group { margin: 12px 0 8px; }
  .option-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .role-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .role-pick label { flex: 1 1 28%; text-align: center; border: 1px solid #ddd; border-radius: 10px; padding: 10px 6px; font-size: 13px; background: white; }
  .role-pick input { margin-right: 4px; }
  .plus-one { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid #ddd; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .stepper button { width: 32px; height: 32px; padding: 0; margin: 0; border-radius: 50%; border: 1px solid #ddd; background: #f0f0f0; font-size: 18px; line-height: 1; color: #333; }
  .stepper span { min-width: 18px; text-align: center; font-size: 16px; font-weight: 600; }
  button { font-size: 16px; padding: 12px 20px; border-radius: 10px; border: none; width: 100%; margin-top: 8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .join { background: #06c755; color: white; }
  .cancel { background: #eee; color: #333; }
  .group-link { background: #e8f8ee; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 14px; display: none; }
  .group-link a { color: #06c755; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 16px 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; flex-wrap: wrap; }
  li .tag { font-size: 11px; color: #888; background: #f0f0f0; border-radius: 6px; padding: 1px 6px; }
  img { width: 28px; height: 28px; border-radius: 50%; background: #ddd; }
  .status { padding: 10px; border-radius: 8px; background: #fff3cd; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
  <h1 id="title">載入中...</h1>
  <div class="info" id="info"></div>
  <div class="status" id="status"></div>

  <div class="count"><span id="count">-</span> <small>人報名</small></div>
  <div class="subcount" id="subcount"></div>

  <div class="option-group" id="attendanceTypeGroup" style="display:none">
    <div class="option-label">參加類型</div>
    <div class="role-pick">
      <label><input type="radio" name="attendanceType" value="activity_only" checked />只參加活動</label>
      <label><input type="radio" name="attendanceType" value="activity_and_meal" />活動+聚餐</label>
      <label><input type="radio" name="attendanceType" value="meal_only" />聚餐</label>
    </div>
  </div>

  <div class="option-group" id="carRoleGroup" style="display:none">
    <div class="option-label">車輛</div>
    <div class="role-pick">
      <label><input type="radio" name="role" value="driver" checked />開車</label>
      <label><input type="radio" name="role" value="passenger" />共乘(乘客)</label>
    </div>
  </div>

  <div class="option-group" id="plusOneGroup" style="display:none">
    <div class="plus-one">
      <span>攜伴人數</span>
      <div class="stepper">
        <button type="button" id="plusOneMinus">−</button>
        <span id="plusOneValue">0</span>
        <button type="button" id="plusOnePlus">＋</button>
      </div>
    </div>
  </div>

  <button class="join" id="joinBtn" disabled>我要參加</button>
  <button class="cancel" id="cancelBtn" disabled>取消報名</button>

  <div class="group-link" id="groupLinkBox">
    已報名!記得加入活動群組 → <a id="groupLinkA" href="#" target="_blank">點我加入</a>
  </div>

  <ul id="roster"></ul>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const params = new URLSearchParams(location.search);
const eventId = params.get('event');
let profile = null;
let eventData = null;
let plusOneCount = 0;

function show(id, html) { document.getElementById(id).innerHTML = html; }
function showStatus(msg) { const el = document.getElementById('status'); el.textContent = msg; el.style.display = 'block'; }
function row(label, value) { return value ? `<div><span class="label">${label}</span><span>${value}</span></div>` : ''; }
const attendanceLabel = { activity_only: '只參加活動', activity_and_meal: '活動+聚餐', meal_only: '聚餐' };

async function loadEvent() {
  const res = await fetch(`/api/events/${eventId}`);
  if (!res.ok) throw new Error('找不到活動');
  eventData = await res.json();
  show('title', eventData.title ?? '找不到活動');
  const info = [
    row('主揪', eventData.organizer),
    row('日期', eventData.event_date),
    row('集合', [eventData.meeting_location, eventData.meeting_time].filter(Boolean).join(' / ')),
    row('費用', eventData.fee),
    row('乘客車資', eventData.passenger_fee),
    row('人數', eventData.capacity ? `${eventData.capacity} 人` : null),
    row('報名截止', eventData.cutoff_at),
  ].join('');
  show('info', info + (eventData.notes ? `<div class="notes">${eventData.notes}</div>` : ''));
  if (eventData.status === 'closed') showStatus('已截止報名,名單已確定');
  if (eventData.group_link) {
    document.getElementById('groupLinkA').href = eventData.group_link;
  } else {
    document.getElementById('groupLinkBox').style.display = 'none';
  }

  document.getElementById('attendanceTypeGroup').style.display = eventData.enable_attendance_type ? 'block' : 'none';
  document.getElementById('carRoleGroup').style.display = eventData.enable_car_role ? 'block' : 'none';
  document.getElementById('plusOneGroup').style.display = eventData.enable_plus_one ? 'block' : 'none';
}

async function loadRoster() {
  const res = await fetch(`/api/events/${eventId}/roster`);
  const data = await res.json();
  show('count', data.registeredCount);

  const subParts = [];
  if (eventData.enable_car_role) subParts.push(`開車 ${data.driverCount} · 共乘 ${data.passengerCount}`);
  if (eventData.enable_attendance_type) {
    subParts.push(`只活動 ${data.activityOnlyCount} · 活動+聚餐 ${data.activityAndMealCount} · 只聚餐 ${data.mealOnlyCount}`);
  }
  if (eventData.enable_plus_one && data.totalHeadcount !== data.registeredCount) {
    subParts.push(`含攜伴共 ${data.totalHeadcount} 人`);
  }
  show('subcount', subParts.join(' · '));

  const ul = document.getElementById('roster');
  ul.innerHTML = '';
  data.roster.forEach((r) => {
    if (!r.displayName) return;
    const li = document.createElement('li');
    const tags = [];
    if (r.role === 'driver') tags.push('開車');
    if (r.role === 'passenger') tags.push('共乘');
    if (attendanceLabel[r.attendanceType]) tags.push(attendanceLabel[r.attendanceType]);
    if (r.plusOneCount) tags.push(`+${r.plusOneCount}`);
    li.innerHTML = `<img src="${r.pictureUrl ?? ''}" /> <span>${r.displayName}</span> ${tags.map((t) => `<span class="tag">${t}</span>`).join('')}`;
    ul.appendChild(li);
  });
}

async function register() {
  const payload = { lineUserId: profile.userId, displayName: profile.displayName, pictureUrl: profile.pictureUrl };
  if (eventData.enable_car_role) payload.role = document.querySelector('input[name=role]:checked').value;
  if (eventData.enable_attendance_type) payload.attendanceType = document.querySelector('input[name=attendanceType]:checked').value;
  if (eventData.enable_plus_one) payload.plusOneCount = plusOneCount;
  const res = await fetch(`/api/events/${eventId}/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const err = await res.json();
    showStatus(err.error === 'full' ? '已經額滿了' : '報名失敗,請稍後再試');
    return;
  }
  if (eventData?.group_link) document.getElementById('groupLinkBox').style.display = 'block';
  await loadRoster();
}

async function cancel() {
  await fetch(`/api/events/${eventId}/cancel`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lineUserId: profile.userId }),
  });
  document.getElementById('groupLinkBox').style.display = 'none';
  await loadRoster();
}

async function init() {
  if (!eventId) throw new Error('報名連結缺少活動編號');
  document.getElementById('plusOneMinus').onclick = () => {
    plusOneCount = Math.max(0, plusOneCount - 1);
    document.getElementById('plusOneValue').textContent = plusOneCount;
  };
  document.getElementById('plusOnePlus').onclick = () => {
    plusOneCount = Math.min(20, plusOneCount + 1);
    document.getElementById('plusOneValue').textContent = plusOneCount;
  };

  // Event information should remain visible even when an external browser or
  // content blocker prevents the LINE SDK from reaching LINE's login service.
  await loadEvent();
  await loadRoster();

  try {
    const cfgRes = await fetch('/api/config');
    if (!cfgRes.ok) throw new Error('LINE 設定讀取失敗');
    const cfg = await cfgRes.json();
    await liff.init({ liffId: cfg.liffId, withLoginOnExternalBrowser: true });
    if (!liff.isLoggedIn() && !liff.isInClient()) { liff.login({ redirectUri: location.href }); return; }
    profile = await liff.getProfile();
  } catch (e) {
    const message = String(e?.message ?? e);
    showStatus(message.includes('Failed to fetch')
      ? '活動資料已載入，但這個瀏覽器擋住了 LINE 登入服務。請把報名連結貼到 LINE 對話中，再從 LINE 開啟。'
      : `LINE 登入暫時無法使用：${message}`);
    return;
  }
  document.getElementById('joinBtn').onclick = register;
  document.getElementById('cancelBtn').onclick = cancel;
  document.getElementById('joinBtn').disabled = false;
  document.getElementById('cancelBtn').disabled = false;
}

init().catch((e) => showStatus('頁面載入失敗：' + e.message));
</script>
</body>
</html>
