<h1>隱私權政策</h1>
<p>本服務(活動報名系統)用於協助統計活動報名人數,僅存取以下資訊:</p>
<ul>
  <li>你的 LINE 顯示名稱與大頭貼(用於顯示在報名名單上)</li>
  <li>你的 LINE 使用者 ID(用於辨識報名/取消,避免重複計算)</li>
</ul>

<h2>這些資料會用在哪裡</h2>
<p>僅用於該場活動的報名人數統計與名單顯示,不會用於廣告、不會轉售或提供給與該活動無關的第三方。</p>

<h2>資料保留</h2>
<p>報名紀錄會保留至活動結束後,供主辦人核對人數使用,之後可應要求刪除。</p>

<h2>聯絡方式</h2>
<p>如有疑問,請透過你報名時所在的 LINE 群組聯絡主辦人。</p>
</body>
