<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>活動管理</title>
<style>
  body { font-family: -apple-system, "PingFang TC", sans-serif; margin: 0; padding: 16px; background: #f7f7f7; color: #222; max-width: 640px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 28px; color: #555; }
  form { background: white; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 4px; }
  input[type=text], input[type=number], textarea { font-size: 14px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
  textarea { min-height: 100px; }
  .checks { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
  .checks label { flex-direction: row; align-items: center; gap: 6px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font-size: 15px; padding: 10px 18px; border-radius: 8px; border: none; background: #06c755; color: white; cursor: pointer; }
  button.secondary { background: #eee; color: #333; }
  .result { background: #e8f8ee; border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 13px; word-break: break-all; display: none; }
  .result a { color: #06c755; font-weight: 600; }
  .event-list { list-style: none; padding: 0; }
  .event-list li { background: white; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .event-list .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .event-list .meta { color: #888; font-size: 12px; }
  .event-list .headcount { color: #06c755; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 2px; }
  .event-list a.edit { color: #06c755; font-size: 13px; white-space: nowrap; }
  .event-list a.delete { color: #e0453c; font-size: 13px; white-space: nowrap; }
  .roster-box { display: none; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
  .roster-box ul { list-style: none; padding: 0; margin: 0; }
  .roster-box li { padding: 3px 0; font-size: 13px; background: none; }
  .roster-box .tag { font-size: 10px; color: #888; background: #f0f0f0; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
  .badge { font-size: 11px; background: #f0f0f0; color: #888; border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
  <h1 id="formTitle">建立新活動</h1>
  <form id="eventForm">
    <label>主題 *<input type="text" id="f_title" required /></label>
    <div class="two-col">
      <label>主揪<input type="text" id="f_organizer" /></label>
      <label>日期<input type="text" id="f_eventDate" placeholder="10/29(四)" /></label>
    </div>
    <div class="two-col">
      <label>集合地點<input type="text" id="f_meetingLocation" /></label>
      <label>集合時間<input type="text" id="f_meetingTime" placeholder="08:00" /></label>
    </div>
    <div class="two-col">
      <label>費用<input type="text" id="f_fee" /></label>
      <label>乘客車資<input type="text" id="f_passengerFee" /></label>
    </div>
    <div class="two-col">
      <label>人數上限<input type="number" id="f_capacity" min="1" /></label>
      <label>報名截止日<input type="text" id="f_cutoffAt" placeholder="10/28" /></label>
    </div>
    <label>活動群連結<input type="text" id="f_groupLink" placeholder="https://line.me/ti/g/..." /></label>
    <label>備註 / 活動聲明<textarea id="f_notes"></textarea></label>

    <div class="checks">
      <label><input type="checkbox" id="f_enableAttendanceType" />參加類型(只活動/活動+聚餐/聚餐)</label>
      <label><input type="checkbox" id="f_enableCarRole" />車輛(開車/共乘)</label>
      <label><input type="checkbox" id="f_enablePlusOne" />攜伴人數</label>
    </div>

    <label id="statusField" style="display:none">狀態
      <select id="f_status">
        <option value="open">開放報名</option>
        <option value="closed">已截止</option>
      </select>
    </label>

    <div style="display:flex; gap:8px;">
      <button type="submit" id="submitBtn">建立活動</button>
      <button type="button" class="secondary" id="cancelEditBtn" style="display:none">取消編輯</button>
    </div>
  </form>

  <div class="result" id="result"></div>

  <h2>最近的活動</h2>
  <ul class="event-list" id="eventList"></ul>

<script>
let liffId = '';
let editingId = null;

function getPasscode() {
  let code = localStorage.getItem('adminPasscode');
  if (!code) {
    code = prompt('請輸入管理密碼');
    if (code) localStorage.setItem('adminPasscode', code);
  }
  return code || '';
}

async function adminFetch(url, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), 'X-Admin-Passcode': getPasscode() },
  });
  if (res.status === 401) {
    localStorage.removeItem('adminPasscode');
    alert('密碼錯誤,請重新輸入');
    location.reload();
    throw new Error('unauthorized');
  }
  return res;
}

async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  liffId = cfg.liffId;
}

function getFormData() {
  return {
    title: document.getElementById('f_title').value.trim(),
    organizer: document.getElementById('f_organizer').value.trim() || undefined,
    eventDate: document.getElementById('f_eventDate').value.trim() || undefined,
    meetingLocation: document.getElementById('f_meetingLocation').value.trim() || undefined,
    meetingTime: document.getElementById('f_meetingTime').value.trim() || undefined,
    fee: document.getElementById('f_fee').value.trim() || undefined,
    passengerFee: document.getElementById('f_passengerFee').value.trim() || undefined,
    capacity: document.getElementById('f_capacity').value ? parseInt(document.getElementById('f_capacity').value, 10) : undefined,
    cutoffAt: document.getElementById('f_cutoffAt').value.trim() || undefined,
    groupLink: document.getElementById('f_groupLink').value.trim() || undefined,
    notes: document.getElementById('f_notes').value.trim() || undefined,
    status: document.getElementById('f_status').value,
    enableAttendanceType: document.getElementById('f_enableAttendanceType').checked,
    enableCarRole: document.getElementById('f_enableCarRole').checked,
    enablePlusOne: document.getElementById('f_enablePlusOne').checked,
  };
}

function fillForm(ev) {
  document.getElementById('f_title').value = ev.title ?? '';
  document.getElementById('f_organizer').value = ev.organizer ?? '';
  document.getElementById('f_eventDate').value = ev.event_date ?? '';
  document.getElementById('f_meetingLocation').value = ev.meeting_location ?? '';
  document.getElementById('f_meetingTime').value = ev.meeting_time ?? '';
  document.getElementById('f_fee').value = ev.fee ?? '';
  document.getElementById('f_passengerFee').value = ev.passenger_fee ?? '';
  document.getElementById('f_capacity').value = ev.capacity ?? '';
  document.getElementById('f_cutoffAt').value = ev.cutoff_at ?? '';
  document.getElementById('f_groupLink').value = ev.group_link ?? '';
  document.getElementById('f_notes').value = ev.notes ?? '';
  document.getElementById('f_status').value = ev.status ?? 'open';
  document.getElementById('f_enableAttendanceType').checked = !!ev.enable_attendance_type;
  document.getElementById('f_enableCarRole').checked = !!ev.enable_car_role;
  document.getElementById('f_enablePlusOne').checked = !!ev.enable_plus_one;
}

function resetForm() {
  document.getElementById('eventForm').reset();
  editingId = null;
  document.getElementById('formTitle').textContent = '建立新活動';
  document.getElementById('submitBtn').textContent = '建立活動';
  document.getElementById('statusField').style.display = 'none';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('result').style.display = 'none';
}

async function startEdit(id) {
  const res = await fetch(`/api/events/${id}`);
  const ev = await res.json();
  if (ev.error) { alert('找不到這個活動'); return; }
  editingId = id;
  fillForm(ev);
  document.getElementById('formTitle').textContent = `編輯:${ev.title}`;
  document.getElementById('submitBtn').textContent = '儲存修改';
  document.getElementById('statusField').style.display = 'flex';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  showLinks(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showLinks(id) {
  const liffUrl = `https://liff.line.me/${liffId}?event=${id}`;
  const directUrl = `${location.origin}/liff?event=${id}`;
  const box = document.getElementById('result');
  box.innerHTML = `
    報名連結(分享到群組用):<br />
    <a href="${liffUrl}" target="_blank">${liffUrl}</a><br /><br />
    備用連結(預覽卡片較準,登入多一步):<br />
    <a href="${directUrl}" target="_blank">${directUrl}</a>
  `;
  box.style.display = 'block';
}

async function loadEventList() {
  const res = await adminFetch('/api/events');
  const events = await res.json();
  const ul = document.getElementById('eventList');
  ul.innerHTML = '';
  events.forEach((ev) => {
    const li = document.createElement('li');
    const statusBadge = ev.status === 'closed' ? '<span class="badge">已截止</span>' : '';
    const capLabel = ev.capacity ? `${ev.registered_count}/${ev.capacity}` : `${ev.registered_count}`;
    const headcountExtra = ev.total_headcount !== ev.registered_count ? `(含攜伴共${ev.total_headcount}人)` : '';
    li.innerHTML = `
      <div class="row">
        <div>
          <div>${ev.title} ${statusBadge}</div>
          <div class="meta">${ev.event_date ?? ''} ${ev.capacity ? `· 上限${ev.capacity}人` : ''} · 截止 ${ev.cutoff_at ?? '未設定'}</div>
          <div class="headcount">${capLabel} 人報名 ${headcountExtra} · 查看名單 ▾</div>
        </div>
        <div style="display:flex; gap:10px;">
          <a class="edit" href="#" data-id="${ev.id}">編輯</a>
          <a class="delete" href="#" data-id="${ev.id}">刪除</a>
        </div>
      </div>
      <div class="roster-box">
        <div class="roster-summary"></div>
        <ul class="roster-registered"></ul>
        <div class="roster-cancelled"></div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="button" class="secondary copy-roster">複製名單文字</button>
          <button type="button" class="secondary export-csv">匯出CSV(可開Google試算表)</button>
        </div>
      </div>
    `;
    li.dataset.title = ev.title;
    li.querySelector('a.edit').onclick = (e) => { e.preventDefault(); startEdit(ev.id); };
    li.querySelector('a.delete').onclick = (e) => { e.preventDefault(); deleteEvent(ev.id, ev.title); };
    li.querySelector('.headcount').onclick = () => toggleRoster(ev.id, li);
    ul.appendChild(li);
  });
}

const attendanceLabel = { activity_only: '只參加活動', activity_and_meal: '活動+聚餐', meal_only: '聚餐' };

function rosterEntryTags(r) {
  const tags = [];
  if (r.role === 'driver') tags.push('開車');
  if (r.role === 'passenger') tags.push('共乘');
  if (attendanceLabel[r.attendanceType]) tags.push(attendanceLabel[r.attendanceType]);
  if (r.plusOneCount) tags.push(`+${r.plusOneCount}`);
  return tags;
}

async function toggleRoster(id, li) {
  const box = li.querySelector('.roster-box');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  const res = await fetch(`/api/events/${id}/roster`);
  const data = await res.json();

  const summaryParts = [];
  if (data.driverCount || data.passengerCount) summaryParts.push(`開車 ${data.driverCount} · 共乘 ${data.passengerCount}`);
  if (data.activityOnlyCount || data.activityAndMealCount || data.mealOnlyCount) {
    summaryParts.push(`只活動 ${data.activityOnlyCount} · 活動+聚餐 ${data.activityAndMealCount} · 只聚餐 ${data.mealOnlyCount}`);
  }
  if (data.totalHeadcount !== data.registeredCount) summaryParts.push(`含攜伴共 ${data.totalHeadcount} 人`);
  summaryParts.push(`已取消 ${data.cancelledCount} 人`);
  box.querySelector('.roster-summary').innerHTML = summaryParts.map((s) => `<div class="meta">${s}</div>`).join('');

  const listEl = box.querySelector('.roster-registered');
  listEl.innerHTML = data.roster.length
    ? data.roster.map((r) => `<li>${r.displayName ?? '(隱藏姓名)'} ${rosterEntryTags(r).map((t) => `<span class="tag">${t}</span>`).join('')}</li>`).join('')
    : '<li style="color:#aaa">還沒有人報名</li>';

  const cancelledEl = box.querySelector('.roster-cancelled');
  cancelledEl.innerHTML = data.cancelledRoster.length
    ? `<div class="meta" style="margin-top:6px;">已取消:${data.cancelledRoster.map((r) => r.displayName ?? '(隱藏姓名)').join('、')}</div>`
    : '';

  box.querySelector('.copy-roster').onclick = () => {
    const lines = [
      li.dataset.title,
      `報名 ${data.registeredCount} 人`,
      ...summaryParts.filter((s) => !s.startsWith('已取消')),
      '',
      ...data.roster.map((r, i) => `${i + 1}. ${r.displayName ?? '(隱藏姓名)'} ${rosterEntryTags(r).join(' ')}`.trim()),
      '',
      `已取消 ${data.cancelledCount} 人${data.cancelledRoster.length ? `:${data.cancelledRoster.map((r) => r.displayName ?? '(隱藏姓名)').join('、')}` : ''}`,
    ].filter((line) => line !== null && line !== undefined);
    navigator.clipboard.writeText(lines.join('\n')).then(
      () => alert('已複製名單'),
      () => alert('複製失敗,請手動選取')
    );
  };

  box.querySelector('.export-csv').onclick = () => {
    const csvField = (v) => {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const rows = [['姓名', '開車/共乘', '參加類型', '攜伴人數', '狀態']];
    data.roster.forEach((r) => {
      rows.push([
        r.displayName ?? '(隱藏姓名)',
        r.role === 'driver' ? '開車' : r.role === 'passenger' ? '共乘' : '',
        attendanceLabel[r.attendanceType] ?? '',
        r.plusOneCount || 0,
        '已報名',
      ]);
    });
    data.cancelledRoster.forEach((r) => {
      rows.push([r.displayName ?? '(隱藏姓名)', '', '', '', '已取消']);
    });
    // UTF-8 BOM so Excel/Google Sheets don't mangle Chinese characters on import
    const csv = '﻿' + rows.map((row) => row.map(csvField).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${li.dataset.title}-報名名單.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  box.style.display = 'block';
}

document.getElementById('eventForm').onsubmit = async (e) => {
  e.preventDefault();
  const data = getFormData();
  if (!data.title) return;

  const url = editingId ? `/api/events/${editingId}` : '/api/events';
  const method = editingId ? 'PUT' : 'POST';
  const res = await adminFetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const result = await res.json();
  if (!res.ok) { alert('儲存失敗: ' + (result.error ?? '')); return; }

  const id = editingId ?? result.id;
  showLinks(id);
  await loadEventList();
};

async function deleteEvent(id, title) {
  if (!confirm(`確定要刪除「${title}」?已經報名的人數跟名單會一起被清掉,刪了就回不來了。`)) return;
  const res = await adminFetch(`/api/events/${id}`, { method: 'DELETE' });
  if (!res.ok) { alert('刪除失敗'); return; }
  if (editingId === id) resetForm();
  await loadEventList();
}

document.getElementById('cancelEditBtn').onclick = resetForm;

(async () => {
  await loadConfig();
  await loadEventList();
})();
</script>
</body>
</html>
