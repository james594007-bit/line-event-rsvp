<h1>服務條款</h1>
<p>本服務(活動報名系統)提供活動報名、取消與人數統計功能,供社群活動主辦人使用。</p>

<h2>使用須知</h2>
<ul>
  <li>報名資訊(是否開車/共乘等)請據實填寫,方便主辦人安排活動</li>
  <li>活動本身之安排、安全與風險評估,由主辦人與參加者自行負責,本服務僅提供報名統計功能</li>
  <li>請勿利用本服務進行與活動報名無關之用途</li>
</ul>

<h2>服務變動</h2>
<p>本服務仍在測試階段,功能與介面可能隨時調整。</p>
